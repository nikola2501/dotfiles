set -g mouse on
setw -g mode-keys vi

unbind C-b
set -g prefix C-a
bind -N "Send Ctrl+a to the program in the pane" C-a send-prefix

# Vim style pane selection
bind -N "Select the pane to the left" h select-pane -L
bind -N "Select the pane below" j select-pane -D
bind -N "Select the pane above" k select-pane -U
bind -N "Select the pane to the right" l select-pane -R

# Jump windows
bind -N "Select window 1" -n M-1 select-window -t 1
bind -N "Select window 2" -n M-2 select-window -t 2
bind -N "Select window 3" -n M-3 select-window -t 3
bind -N "Select window 4" -n M-4 select-window -t 4
bind -N "Select window 5" -n M-5 select-window -t 5
bind -N "Select window 6" -n M-6 select-window -t 6
bind -N "Select window 7" -n M-7 select-window -t 7
bind -N "Select window 8" -n M-8 select-window -t 8
bind -N "Select window 9" -n M-9 select-window -t 9

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -N "Select the pane to the left" -n M-Left select-pane -L
bind -N "Select the pane to the right" -n M-Right select-pane -R
bind -N "Select the pane above" -n M-Up select-pane -U
bind -N "Select the pane below" -n M-Down select-pane -D

# Shift arrow to switch windows
bind -N "Previous window" -n S-Left  previous-window
bind -N "Next window" -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -N "Previous window" -n M-H previous-window
bind -N "Next window" -n M-L next-window

set -g @catppuccin_flavour 'mocha'
# keybindings
bind-key -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection
bind-key -N "Toggle rectangle selection" -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -N "Copy the selection and leave copy mode" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -N "Split top/bottom, in the same directory" v split-window -v -c "#{pane_current_path}"
bind -N "Split left/right, in the same directory" b split-window -h -c "#{pane_current_path}"

# ? is a popup with only the keys this config adds, read out of the -N notes
# above by bin/tmux-keys. Alt+? is the full list: the stock one shows the prefix
# table only, this one adds the keys that need no prefix and the copy mode ones
bind -N "Show the keys this config adds" ? run-shell "~/.local/bin/tmux-keys --popup"
bind -N "List every key binding" M-? run-shell "tmux list-keys -N -P 'no prefix  ' -T root; tmux list-keys -N -P 'copy mode  ' -T copy-mode-vi; tmux list-keys -N -T prefix"

# set vi-mode
set-window-option -g mode-keys vi

############### Plugin manager ####################
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'


run '~/.tmux/plugins/tpm/tpm'

# The theme centres the message line and leaves it unfilled. tmux 3.7 then draws
# the prompt (a copy mode search, C-a :) centred with the window names showing
# through and the cursor at the left. Left-aligned and filled, as stock tmux.
set -g message-style "fg=#89dceb,bg=#313244,fill=#313244"
set -g message-command-style "fg=#89dceb,bg=#313244,fill=#313244"
