# Foot terminal config
# topo.vim colorscheme theme

[main]
font=MesloLGS Nerd Font:size=12
dpi-aware=yes

[colors]
# Background and foreground - matching topo.vim
background=121212
foreground=ffffff

# Cursor
cursor=121212 ffffff

# Normal colors
regular0=121212   # black (background)
regular1=fd007b   # red (keyword pink)
regular2=01d5f3   # green (literal cyan)
regular3=01d5f3   # yellow (literal cyan)
regular4=fd007b   # blue (keyword pink)
regular5=fd007b   # magenta (keyword pink)
regular6=01d5f3   # cyan (literal cyan)
regular7=ffffff   # white

# Bright colors
bright0=3a3a3a    # bright black (gray)
bright1=fd007b    # bright red (keyword pink)
bright2=01d5f3    # bright green (literal cyan)
bright3=01d5f3    # bright yellow (literal cyan)
bright4=fd007b    # bright blue (keyword pink)
bright5=fd007b    # bright magenta (keyword pink)
bright6=01d5f3    # bright cyan (literal cyan)
bright7=ffffff    # bright white

# Selection
selection-foreground=ffffff
selection-background=2a2a2a

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
