D=":bc"
L=":rla"
q.a=":ab"
q.d=":rb"
q.0=":j 0"
F1=":j 0"
q.1=":j 1"
F2=":j 1"
q.2=":j 2"
F3=":j 2"
q.3=":j 3"
F4=":j 3"
q.4=":j 4"
F5=":j 4"

# move/copy line below/above
"A-j" = [ "extend_to_line_bounds", "delete_selection", "paste_after" ]
"A-J" = [ "extend_to_line_bounds", "yank", "paste_after" ]
"A-k" = [ "extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before" ]
"A-K" = [ "extend_to_line_bounds", "yank", "paste_before" ]
[keys.insert]
C-t = ["extend_to_line_bounds", ":pipe sh ~/.config/helix/exec.sh 2>&1", "normal_mode", "open_below"]
[keys.select]
C-t = [":pipe sh ~/.config/helix/exec.sh 2>&1"]

[keys.normal.g]
I = ":echo %sh{gh browse '%{buffer_name}:%{cursor_line}' -c}"
# b = ":noop %sh{gh browse '%{buffer_name}:%{cursor_line}' -c}"C
# blame
b = ":sh git -C $(dirname $(realpath %{buffer_name})) blame -L %{cursor_line},%{cursor_line} $(realpath %{buffer_name})"
B = ":sh gh browse '%{buffer_name}:%{cursor_line}' -c"

# C-b = ":sh gh browse %{buffer_name}:%{cursor_line} -c=%sh{latest_pushed_commit}"
# B = ":echo %sh{git blame --date=short -L %{cursor_line},+1 %{buffer_name} | sed -E 's/[0-9]+).*//' | sed 's/(//g'}"
# B = ":echo %sh{git blame --date=short -L %{cursor_line},+1 %{buffer_name}}"

