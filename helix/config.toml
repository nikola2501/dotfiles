theme = "atlas-ragnarok"
# theme = "catppuccin_latte"

[editor]
line-number = "relative"
mouse = true
middle-click-paste = true
rulers = [120]
shell = ["zsh", "-c"]
bufferline = "always"
popup-border = "all"
cursorline = true
gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
completion-timeout = 50
color-modes = true
auto-pairs = true
end-of-line-diagnostics = "hint"
idle-timeout = 0

[editor.cursor-shape]
insert = "bar"
# insert = "block"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable=false

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = false

[editor.statusline]
left = ["mode", "spinner", "file-modification-indicator", "file-name", "version-control"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"


[keys.normal]
# >>> hx-kit >>>
# Bindings for hx-make (quickfix / compile mode) and hx-harpoon (pinned files).
# These are dotted keys destined for the [keys.normal] table; install.sh splices
# them in between its markers, so re-running the installer updates them in place.

# --- quickfix / compile mode ---
# <space>m : build (auto-detected) into the quickfix buffer
# <space>M : same, but keep the cursor where it is
# <space>q : refresh / reopen the quickfix buffer
# A-ret    : jump to what the current line points at — a path:row:col in a
#            list, or a position inside a unified diff. Any saved buffer.
space.m = [":sh hx-make", ":open %sh{hx-make --path}", ":reload", "goto_file_start"]
space.M = [":sh hx-make", ":open %sh{hx-make --path}", ":reload"]
space.q = [":open %sh{hx-make --path}", ":reload"]
"A-ret" = ":open %sh{hx-jump \"%{file_path_absolute}\" %{cursor_line}}"

# --- git changes as a jumpable buffer ---
# <space>vs : which FILES changed        ("what am I working on")
# <space>vc : which LINES changed vs HEAD, staged and unstaged both
# <space>vb : which LINES changed vs the merge-base with main/master
# <space>vd : the DIFF vs HEAD          <space>vr : the DIFF vs merge-base (PR review)
# A-ret jumps from any of them, same as from the quickfix buffer.
space.v.s = [":sh hx-git status",  ":open %sh{hx-git --path}", ":reload", "goto_file_start"]
space.v.c = [":sh hx-git changed", ":open %sh{hx-git --path}", ":reload", "goto_file_start"]
space.v.b = [":sh hx-git branch",  ":open %sh{hx-git --path}", ":reload", "goto_file_start"]
# the actual diff, syntax-highlighted, for reading a change rather than listing it
space.v.d = [":sh hx-diff changed", ":open %sh{hx-diff --path}", ":reload", "goto_file_start"]
space.v.r = [":sh hx-diff review",  ":open %sh{hx-diff --path}", ":reload", "goto_file_start"]
# delta emits ANSI colour, which a Helix buffer cannot render — so it goes in a
# tmux popup, for reading only. Use <space>vr when you want to jump into code.
space.v.p = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E 'hx-diff --raw review | delta --paging=always'"

# --- harpoon: per-project pinned files ---
# <space>za pin current file+line   <space>ze edit the pin list as a buffer
# <space>zl list                    <space>zc clear
# A-1 .. A-9 jump to pin N
"A-1" = ":open %sh{hx-harpoon get 1}"
"A-2" = ":open %sh{hx-harpoon get 2}"
"A-3" = ":open %sh{hx-harpoon get 3}"
"A-4" = ":open %sh{hx-harpoon get 4}"
"A-5" = ":open %sh{hx-harpoon get 5}"
"A-6" = ":open %sh{hx-harpoon get 6}"
"A-7" = ":open %sh{hx-harpoon get 7}"
"A-8" = ":open %sh{hx-harpoon get 8}"
"A-9" = ":open %sh{hx-harpoon get 9}"
space.z.a = ":echo %sh{hx-harpoon add \"%{buffer_name}\" %{cursor_line}}"
space.z.e = [":open %sh{hx-harpoon file}", ":reload"]
space.z.l = ":echo %sh{hx-harpoon list}"
space.z.c = ":echo %sh{hx-harpoon clear}"
# <<< hx-kit <<<
esc = ["collapse_selection", "keep_primary_selection"]
C-u = ["half_page_up", "align_view_center"]
C-d = ["half_page_down", "align_view_center"]
X = ["extend_line_up"]
C-p = ["goto_previous_buffer"]
C-n = ["goto_next_buffer"]
"ret" = "goto_word"
space.o = "file_picker_in_current_buffer_directory"

space.1 = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
space.2 = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E nnn"
space.3 = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E 'git diff main -- | diffnav'"
space.4 = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E tig"
space.5 = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E 'gh dash'"
space.6 = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E 'opencode'"
space.7 = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w95%% -h95%% -E 'claude'"

# -----------------------------------------------------------------------------

D=":bc"
L=":rla"

# move/copy line below/above
"A-j" = [ "extend_to_line_bounds", "delete_selection", "paste_after" ]
"A-J" = [ "extend_to_line_bounds", "yank", "paste_after" ]
"A-k" = [ "extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before" ]
"A-K" = [ "extend_to_line_bounds", "yank", "paste_before" ]
[keys.insert]
C-t = ["extend_to_line_bounds", ":pipe sh ~/.config/helix/exec.sh 2>&1", "normal_mode", "open_below"]
[keys.select]
C-t = [":pipe sh ~/.config/helix/exec.sh 2>&1"]

[keys.normal.g]
I = ":echo %sh{gh browse '%{buffer_name}:%{cursor_line}' -c}"
b = ":sh git -C $(dirname $(realpath %{buffer_name})) blame -L %{cursor_line},%{cursor_line} $(realpath %{buffer_name})"
B = ":sh gh browse '%{buffer_name}:%{cursor_line}' -c"

[keys.select.v]
m = "match_brackets"
k = "match_brackets"
s = "surround_add"
r = "surround_replace"
d = "surround_delete"
a = "select_textobject_around"
i = "select_textobject_inner"

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "hint"
# Minimum severity to show a diagnostic on the primary cursor's line.
# Note that `cursor-line` diagnostics are hidden in insert mode.
# cursor-line = "info"
# Minimum severity to show a diagnostic on other lines:
# other-lines = "error"
